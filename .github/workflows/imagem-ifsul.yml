# Imagem do MOJ para o cluster do IFSul Sapucaia (ver ifsul/README.md).
# Reproduz o `make image` da VM: contexto = pasta de trabalho com cdmoj,
# mojtools e moj-cli lado a lado; CLI e docs/html gerados antes do build.
# Cada push na branch "ifsul" publica ghcr.io/<dono>/moj-server:ifsul-<commit>.
name: imagem-ifsul

on:
  push:
    branches: [ifsul]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  MOJTOOLS_REPO: alexorozco-ifsul/mojtools
  MOJTOOLS_REF: local/moj-vm # 84edb77: upstream (FUNCTION_LANGS, locale do Java) + tags no índice de donos
  # moj-cli oficial (com moj-contest esqueletos, 8587ea8); o cdmoj traz os artefatos dessa versão
  MOJCLI_REPO: cd-moj/moj-cli
  MOJCLI_REF: 8587ea891e98dddbac1774ece2fdf8b766fc557d

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/cdmoj
          fetch-depth: 0 # version-json usa o git describe

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MOJTOOLS_REPO }}
          ref: ${{ env.MOJTOOLS_REF }}
          path: ws/mojtools

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MOJCLI_REPO }}
          ref: ${{ env.MOJCLI_REF }}
          path: ws/moj-cli
          fetch-depth: 0 # o mkdist.sh carimba o build com o commit

      - name: CLI (web/moj*), docs/html e web/version.json (rodapé)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
          make -C ws/cdmoj cli-dist docs-html version-json
          ls -l ws/cdmoj/web/moj ws/cdmoj/web/moj.build ws/cdmoj/docs/html/index.html ws/cdmoj/web/version.json

      - id: tag
        run: echo "curta=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # O upstream deixa a CLI (web/moj*) e o docs/html FORA da imagem porque o
      # nginx da VM os serve do checkout do git. No cluster não há checkout: o
      # nginx lê web/ e docs/ da imagem, então eles precisam entrar.
      - name: Ignore do build sem a CLI e o docs/html
        run: |
          grep -vxE 'cdmoj/web/moj|cdmoj/web/moj-contest|cdmoj/web/moj-judges|cdmoj/docs/html/' \
            ws/cdmoj/deploy/.containerignore > "$RUNNER_TEMP/containerignore"
          diff ws/cdmoj/deploy/.containerignore "$RUNNER_TEMP/containerignore" || true

      - name: Build (podman, como o make image)
        run: |
          podman build --ignorefile "$RUNNER_TEMP/containerignore" -f ws/cdmoj/deploy/Containerfile \
            --build-arg WITH_OFFICE=1 --build-arg WITH_JPLAG=1 \
            --label org.opencontainers.image.revision=$(git -C ws/cdmoj rev-parse --short HEAD) \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t ghcr.io/${{ github.repository_owner }}/moj-server:ifsul-${{ steps.tag.outputs.curta }} ws

      - name: Publicar
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push ghcr.io/${{ github.repository_owner }}/moj-server:ifsul-${{ steps.tag.outputs.curta }}
